services:
  db:
    image: postgres:16-alpine
    container_name: sgpp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgpp
      POSTGRES_PASSWORD: sgpp_dev
      POSTGRES_DB: sgpp
    ports:
      - "5432:5432"
    volumes:
      - sgpp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgpp -d sgpp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgpp_pgdata:
